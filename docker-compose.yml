version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: voice_kiosk_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: voice_kiosk
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: voice_kiosk_backend
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://postgres:password@db:5432/voice_kiosk
      OPENAI_BASE_URL: http://192.168.1.35:1234/v1
      OPENAI_API_KEY: lm-studio
      LLM_MODEL: qwen3-vl-4b-instruct-abliterated-v2
    depends_on:
      db:
        condition: service_healthy
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  postgres_data:
