<div
    class="flex flex-col h-[calc(100vh-80px)] max-w-4xl mx-auto bg-gray-800 rounded-xl shadow-2xl overflow-hidden border border-gray-700">

    <!-- Header -->
    <div class="bg-gray-900 px-6 py-4 flex items-center justify-between border-b border-gray-700">
        <div class="flex items-center space-x-4">
            <div class="w-3 h-3 rounded-full bg-green-500 animate-pulse"></div>
            <h2 class="text-xl font-bold text-gray-100">Vivian AI Kiosk</h2>
        </div>
        <div class="flex items-center space-x-4">
            <div class="text-sm text-gray-400">Online</div>
            <button (click)="clearChat()"
                class="p-2 rounded-lg bg-gray-800 hover:bg-red-600 text-gray-400 hover:text-white transition-all"
                title="Reset Conversation">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24"
                    stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                </svg>
            </button>
        </div>
    </div>

    <!-- Chat Area -->
    <div #scrollContainer class="flex-1 overflow-y-auto p-6 space-y-6 bg-gradient-to-b from-gray-800 to-gray-900">

        <div *ngFor="let msg of messages()" [class.justify-end]="msg.role === 'user'"
            class="flex items-start transition-all duration-300">

            <!-- Assistant Avatar -->
            <div *ngIf="msg.role === 'assistant'"
                class="w-10 h-10 rounded-full bg-indigo-600 flex items-center justify-center mr-3 flex-shrink-0 shadow-lg">
                <span class="text-xl">🤖</span>
            </div>

            <!-- Message Bubble -->
            <div [class.bg-indigo-600]="msg.role === 'user'" [class.text-white]="msg.role === 'user'"
                [class.bg-gray-700]="msg.role === 'assistant'" [class.text-gray-100]="msg.role === 'assistant'"
                [class.rounded-tr-none]="msg.role === 'user'" [class.rounded-tl-none]="msg.role === 'assistant'"
                class="max-w-[80%] rounded-2xl px-6 py-4 shadow-md text-lg leading-relaxed">

                <p>{{ msg.content }}</p>

                <!-- Order Confirmation Widget -->
                <div *ngIf="msg.orderId" class="mt-4 bg-gray-900 rounded-lg p-4 border border-green-500/30">
                    <div class="flex items-center justify-between mb-2">
                        <span class="text-green-400 font-bold text-sm uppercase">Order Confirmed</span>
                        <span class="text-gray-400 text-xs">#{{ msg.orderId }}</span>
                    </div>
                    <ul class="space-y-1 text-sm text-gray-300">
                        <li *ngFor="let item of msg.items" class="flex justify-between">
                            <span>{{ item.qty }}x {{ item.name }}</span>
                            <span class="text-gray-500">${{ (item.price * item.qty).toFixed(2) }}</span>
                        </li>
                    </ul>
                </div>

                <!-- Replay Audio Button -->
                <button *ngIf="msg.audioBase64" (click)="replayAudio(msg.audioBase64!)"
                    class="mt-3 flex items-center space-x-2 text-sm text-indigo-300 hover:text-white transition-colors focus:outline-none">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24"
                        stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z" />
                    </svg>
                    <span>Replay Audio</span>
                </button>
            </div>

            <!-- User Avatar -->
            <div *ngIf="msg.role === 'user'"
                class="w-10 h-10 rounded-full bg-gray-600 flex items-center justify-center ml-3 flex-shrink-0 shadow-lg">
                <span class="text-xl">👤</span>
            </div>
        </div>

        <!-- Loading Indicator -->
        <div *ngIf="isLoading()" class="flex items-start">
            <div class="w-10 h-10 rounded-full bg-indigo-600 flex items-center justify-center mr-3 flex-shrink-0">
                <span class="text-xl">🤖</span>
            </div>
            <div class="bg-gray-700 rounded-2xl rounded-tl-none px-6 py-4 text-gray-400">
                <span class="animate-pulse">Thinking...</span>
            </div>
        </div>
    </div>

    <!-- Input Area -->
    <div class="bg-gray-900 border-t border-gray-700 p-4">
        <div class="flex items-center space-x-4 max-w-4xl mx-auto">

            <!-- Text Input -->
            <input [(ngModel)]="inputText" (keyup.enter)="handleText()" type="text" placeholder="Type here..."
                class="flex-1 bg-gray-800 text-white placeholder-gray-500 border border-gray-700 rounded-full px-6 py-4 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all" />

            <!-- Voice Input Component -->
            <app-voice-input (audioRecorded)="handleVoice($event)"></app-voice-input>

            <!-- Send Button (Visual only mostly, Enter works) -->
            <button (click)="handleText()"
                class="w-14 h-14 rounded-full bg-indigo-600 hover:bg-indigo-700 text-white flex items-center justify-center shadow-lg transition-colors focus:outline-none focus:ring-4 focus:ring-indigo-500/50">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 transform rotate-90" fill="none"
                    viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8" />
                </svg>
            </button>

        </div>
    </div>
</div>
